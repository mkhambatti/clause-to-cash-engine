te and, unless earlier terminated in accordance with its terms, shall\ncontinue for a period of one (1) year (the \"Initial Term\").\n\n3.2 Renewal. Following the Initial Term, this Agreement shall be automatically\nextended for successive periods of two (2) years (each, a \"Renewal Term\")\nunless either Party gives the other written notice of its intention not to\nrenew not less than ninety (90) days prior to the expiration of the then-\ncurrent term.\n\n3.3 Termination Without Cause. Customer shall have the right, exercisable at\nany time upon not less than ninety (90) days' written notice, to terminate\nthis Agreement without cause; provided that Customer shall pay Vendor an early\ntermination charge equal to one hundred percent (100%) of the fees payable for\nthe balance of the then-current term.\n\nCONFIDENTIAL - Page 2\n\n4.1 Fees. Customer shall pay Vendor the fees set forth in Schedule A.\n\n4.2 Minimum Fees. Customer shall pay Vendor annual minimum fees of USD\n8,560,000 irrespective of actual usage (the \"Minimum Commitment\"), on a take-\nor-pay basis.\n\n4.3 Adjustments. Fees shall be adjusted annually, effective on each\nanniversary of the Effective Date, by an increase of three percent (3%) over\nthe fees in effect for the preceding year.\n\n4.4 Customer shall pay all undisputed invoices within sixty (60) days after\nreceipt thereof.\n\n5.1 Affiliate Orders. Customer's Affiliates shall be entitled to order\nServices hereunder on the terms and at the prices set forth herein, and the\nvolumes ordered by all such Affiliates shall be aggregated with Customer's\nvolumes for purposes of Schedule A.\n\n6.1 Successors. This Agreement shall be binding upon and shall inure to the\nbenefit of the Parties and their respective successors and permitted assigns.\n\nCONFIDENTIAL - Page 3\n\n6.2 Requirements. Nothing herein shall obligate Customer to purchase the\nServices exclusively from Vendor.\n\n6.3 Pricing Warranty. Vendor makes no representation or warranty regarding the\nprices charged to other customers.\n\n7.1 The obligations of confidentiality set forth herein shall survive for a\nperiod of three (3) years following termination or expiration of this\nAgreement.\n\n7.2 Vendor shall defend, indemnify and hold harmless Customer, its Affiliates\nand their respective directors, officers and employees from and against any\nthird-party claims arising out of Vendor's breach hereof.\n\n7.3 In no event shall either Party's aggregate liability exceed the fees paid\nin the twelve (12) months immediately preceding the event giving rise to\nliability, which shall be the Parties' exclusive remedy.\n\n7.4 Vendor shall maintain availability of 99.9% and shall credit Customer ten\npercent (10%) of the monthly fees for each month in which availability is\nbelow 99.5%.\n\nCONFIDENTIAL - Page 4\n\n7.5 Any notice shall be deemed given five (5) days after deposit in the mail.\n\n8.1 Governing Law. This Agreement shall be governed by and construed in\naccordance with the laws of the State of California, without giving effect to\nconflict of laws principles.\n\nSCHEDULE A. PRICING. For Annual Volume of up to 6,500,000 output-hour, the\nUnit Price shall be $0.8432 per output-hour; for Annual Volume in excess of\n6,500,000 output-hour and up to 19,000,000 output-hour, the Unit Price shall\nbe $0.7806 per output-hour; and for Annual Volume in excess of 19,000,000\noutput-hour, the Unit Price shall be $0.7508 per output-hour. The foregoing\ntiered Unit Prices shall be applied on a volume-discount basis, such that the\nUnit Price applicable to the tier in which total Annual Volume falls shall\napply to all units of Annual Volume.\n\nIN WITNESS WHEREOF, the Parties have caused this Agreement to be executed by\ntheir duly authorized representatives.\n","accepted":true,"flagged":[],"fields":[{"name":"customer_party","critical":false,"value":"Meridian Streaming LLC","status":"accept","reasons":[],"conf":0.92,"spans":[[180,291]],"corrected":false},{"na ht, exercisable at\nany time upon not less than thirty (30) days' written notice, to terminate\nthis Agreement without cause; provided that Customer shall pay Vendor an early\ntermination charge equal to twenty-five percent (25%) of the fees payable for\nthe balance of the then-current term.\n\nCONFIDENTIAL - Page 2\n\n4.1 Fees. Customer shall pay Vendor the fees set forth in Schedule A.\n\n4.2 Minimum Fees. Customer shall pay Vendor annual minimum fees of USD\n1,940,000 irrespective of actual usage (the \"Minimum Commitment\"), on a take-\nor-pay basis.\n\n4.3 Adjustments. Fees shall be adjusted annually, effective on each\nanniversary of the Effective Date, by an increase of three percent (3%) over\nthe fees in effect for the preceding year.\n\n4.4 Customer shall pay all undisputed invoices within sixty (60) days after\nreceipt thereof.\n\n6.1 Successors. This Agreement shall be binding upon and shall inure to the\nbenefit of the Parties and their respective successors and permitted assigns.\n\n6.3 Pricing Warranty. Vendor makes no representation or warranty regarding the\nprices charged to other customers.\n\nCONFIDENTIAL - Page 3\n\n7.1 The obligations of confidentiality set forth herein shall survive for a\nperiod of three (3) years following termination or expiration of this\nAgreement.\n\n7.2 Vendor shall defend, indemnify and hold harmless Customer, its Affiliates\nand their respective directors, officers and employees from and against any\nthird-party claims arising out of Vendor's breach hereof.\n\n7.3 In no event shall either Party's aggregate liability exceed the fees paid\nin the twelve (12) months immediately preceding the event giving rise to\nliability, which shall be the Parties' exclusive remedy.\n\n7.4 Vendor shall maintain availability of 99.9% and shall credit Customer ten\npercent (10%) of the monthly fees for each month in which availability is\nbelow 99.5%.\n\n7.5 Any notice shall be deemed given five (5) days after deposit in the mail.\n\n8.1 Governing Law. This Agreement shall be governed by and construed in\naccordance with the laws of the State of California, without giving effect to\nconflict of laws principles.\n\nCONFIDENTIAL - Page 4\n\nSCHEDULE A. PRICING. For Annual Volume of up to 15,000 million-messages, the\nUnit Price shall be $100.51 per million-messages; for Annual Volume in excess\nof 15,000 million-messages and up to 46,000 million-messages, the Unit Price\nshall be $97.29 per million-messages; and for Annual Volume in excess of\n46,000 million-messages, the Unit Price shall be $94.20 per million-messages.\nThe foregoing tiered Unit Prices shall be applied on a marginal basis, such\nthat each unit of Annual Volume shall be priced at the rate applicable to the\ntier in which such unit falls.\n\nIN WITNESS WHEREOF, the Parties have caused this Agreement to be executed by\ntheir duly authorized representatives.\n\nFIRST AMENDMENT TO MASTER SERVICES AGREEMENT\n\nThis First Amendment is made as of the 4th day of February, 2021. The Initial\nTerm set forth in Section 3.1 is hereby extended by a period of six (6)\nmonths. In all other respects the Agreement is ratified and confirmed.\n\nSECOND AMENDMENT TO MASTER SERVICES AGREEMENT\n\nThis Second Amendment is made as of the 5th day of September, 2021. Schedule A\nis hereby deleted in its entirety and replaced with the following: For Annual\nVolume of up to 15,000 million-messages, the Unit Price shall be $92.55 per\nmillion-messages; for Annual Volume in excess of 15,000 million-messages and\nup to 46,000 million-messages, the Unit Price shall be $89.59 per million-\nmessages; and for Annual Volume in excess of 46,000 million-messages, the Unit\nPrice shall be $86.75 per million-messages. The foregoing tiered Unit Prices\nshall be applied on a marginal basis, such that each unit of Annual Volume\nshall be priced at the rate applicable to the tier in which such unit falls.\nIn all other respects the Agreement is ratified and confirmed.\n\nCONF y may, without the consent of the other Party,\nassign this Agreement in its entirety to an Affiliate or to any successor to\nall or substantially all of its business or assets, whether by merger,\nconsolidation or otherwise.\n\nCONFIDENTIAL - Page 3\n\n6.2 Requirements. Nothing herein shall obligate Customer to purchase the\nServices exclusively from Vendor.\n\n6.3 Pricing Warranty. Vendor makes no representation or warranty regarding the\nprices charged to other customers.\n\n7.1 The obligations of confidentiality set forth herein shall survive for a\nperiod of three (3) years following termination or expiration of this\nAgreement.\n\n7.2 Vendor shall defend, indemnify and hold harmless Customer, its Affiliates\nand their respective directors, officers and employees from and against any\nthird-party claims arising out of Vendor's breach hereof.\n\n7.3 In no event shall either Party's aggregate liability exceed the fees paid\nin the twelve (12) months immediately preceding the event giving rise to\nliability, which shall be the Parties' exclusive remedy.\n\n7.4 Vendor shall maintain availability of 99.9% and shall credit Customer ten\npercent (10%) of the monthly fees for each month in which availability is\nbelow 99.5%.\n\nCONFIDENTIAL - Page 4\n\n7.5 Any notice shall be deemed given five (5) days after deposit in the mail.\n\n8.1 Governing Law. This Agreement shall be governed by and construed in\naccordance with the laws of the State of California, without giving effect to\nconflict of laws principles.\n\nSCHEDULE A. PRICING. For Annual Volume of up to 12,000,000 transaction, the\nUnit Price shall be $0.2909 per transaction; for Annual Volume in excess of\n12,000,000 transaction and up to 37,000,000 transaction, the Unit Price shall\nbe $0.2764 per transaction; and for Annual Volume in excess of 37,000,000\ntransaction, the Unit Price shall be $0.2605 per transaction. The foregoing\ntiered Unit Prices shall be applied on a volume-discount basis, such that the\nU rd-party claims arising from Vendor's breach of this Agreement.\n\n7. Limitation of Liability. Each party's total liability will not exceed the fees paid in the twelve (12) months preceding the claim. This Section states each party's exclusive remedy for such claims.\n\n7. Service Levels. Vendor will maintain 99.9% availability and will issue service credits of ten percent (10%) of the monthly fees for any month in which availability falls below 99.5%.\n\n7. Notices. Notices are deemed given five (5) days after mailing.\n\n8. Governing Law. This Agreement is governed by the laws of the State of Delaware, without regard to conflict of law principles.\n\nSCHEDULE A - PRICING\nUnit: core-hour\nTier 1: 0 to 200,000,000 core-hour per year at $0.0667 per core-hour\nTier 2: 200,000,000 to 590,000,000 core-hour per year at $0.0635 per core-hour\nTier 3: Above 590,000,000 core-hour per year at $0.0601 per core-hour\nTiered pricing applies on a graduated basis: each unit is charged at the rate of the tier in which it falls.\n\nIN WITNESS WHEREOF, the parties have executed this Agreement.\nCustomer: ____________________  Vendor: ____________________\n\nAMENDMENT NO. 1 TO MASTER SERVICES AGREEMENT\n\nThis Amendment No. 1 is entered into as of March 15, 2023. Schedule A is deleted in its entirety and replaced with the following:\nUnit: core-hour\nTier 1: 0 to 200,000,000 core-hour per year at $0.0633 per core-hour\nTier 2: 200,000,000 to 590,000,000 core-hour per year at $0.0602 per core-hour\nTier 3: Above 590,000,000 core-hour per year at $0.0570 per core-hour\nTiered pricing applies on a graduated basis: each unit is charged at the rate of the tier in which it falls.\nExcept as modified hereby, all terms of the Agreement remain in full force and effect.\n","accepted":true,"flagged":[],"fields":[{"name":"customer_party","critical":false,"value":"Meridian Pictures Corporation","status":"accept","reasons":[],"conf":0.92,"spans":[[139,256]],"corrected":false},{"name":"vendor_part ove 2,100 channel-month per year at $7,842 per channel-month\nTiered pricing applies on an all-units basis: the rate for the tier in which total Annual Volume falls applies to all units.\n\nIN WITNESS WHEREOF, the parties have executed this Agreement.\nCustomer: ____________________  Vendor: ____________________\n","accepted":true,"flagged":[],"fields":[{"name":"customer_party","critical":false,"value":"Halyard Broadcasting Group, Inc.","status":"accept","reasons":[],"conf":0.92,"spans":[[139,266]],"corrected":false},{"name":"vendor_party","critical":false,"value":"Umbra Broadcast Services Limited","status":"accept","reasons":[],"conf":0.92,"spans":[[139,266]],"corrected":false},{"name":"service_category","critical":true,"value":"playout_mcr","status":"accept","reasons":[],"conf":0.92,"spans":[[295,363]],"corrected":false},{"name":"effective_date","critical":true,"value":"2026-01-18","status":"accept","reasons":[],"conf":0.92,"spans":[[80,108]],"corrected":false},{"name":"initial_term_months","critical":true,"value":"24 months","status":"accept","reasons":[],"conf":0.92,"spans":[[422,551]],"corrected":false},{"name":"auto_renew","critical":true,"value":"no","status":"accept","reasons":[],"conf":0.92,"spans":[[566,675]],"corrected":false},{"name":"renewal_term_months","critical":false,"value":"\u2014","status":"accept","reasons":[],"conf":0.92,"spans":[[566,675]],"corrected":false},{"name":"nonrenewal_notice","critical":true,"value":"\u2014","status":"accept","reasons":[],"conf":0.92,"spans":[[566,675]],"corrected":false},{"name":"termination_for_convenience","critical":true,"value":"no","status":"accept","reasons":[],"conf":0.92,"spans":[[710,769]],"corrected":false},{"name":"tfc_notice_days","critical":false,"value":"\u2014","status":"accept","reasons":[],"conf":0.8,"spans":[],"corrected":false},{"name":"early_termination_fee_pct","critical":true,"value":"\u2014","status":"accept","reasons":[],"conf":0.8,"spans":[],"corrected":false},{"name":"min_annual_commit_usd" shall\ncontinue for a period of two (2) years (the \"Initial Term\").\n\n3.2 No Automatic Renewal. This Agreement shall expire at the end of the\nInitial Term and shall not be renewed except by written instrument executed by\nboth Parties.\n\n3.3 Termination Without Cause. Customer shall have the right, exercisable at\nany time upon not less than sixty (60) days' written notice, to terminate this\nAgreement without cause; provided that Customer shall pay Vendor an early\ntermination charge equal to one hundred percent (100%) of the fees payable for\nthe balance of the then-current term.\n\nCONFIDENTIAL - Page 2\n\n4.1 Fees. Customer shall pay Vendor the fees set forth in Schedule A.\n\n4.2 Minimum Fees. Customer shall pay Vendor annual minimum fees of USD\n13,720,000 irrespective of actual usage (the \"Minimum Commitment\"), on a take-\nor-pay basis.\n\n4.3 Adjustments. Fees shall be adjusted annually, effective on each\nanniversary of the Effective Date, by an increase of three percent (3%) over\nthe fees in effect for the preceding year.\n\n4.4 Customer shall pay all undisputed invoices within sixty (60) days after\nreceipt thereof.\n\n5.1 Affiliate Orders. Customer's Affiliates shall be entitled to order\nServices hereunder on the terms and at the prices set forth herein, and the\nvolumes ordered by all such Affiliates shall be aggregated with Customer's\nvolumes for purposes of Schedule A.\n\n6.1 Assignment. Neither Party shall assign or otherwise transfer this\nAgreement, including by operation of law or in connection with a change of\ncontrol, without the prior written consent of the other Party, such consent\nnot to be unreasonably withheld.\n\nCONFIDENTIAL - Page 3\n\n6.3 Pricing Warranty. Vendor makes no representation or warranty regarding the\nprices charged to other customers.\n\n7.1 The obligations of confidentiality set forth herein shall survive for a\nperiod of three (3) years following termination or expiration of this\nAgreement.\n\n7.2 Vendor shall defend, indemnify and hold harmless Customer, its Affiliates\nand their respective directors, officers and employees from and against any\nthird-party claims arising out of Vendor's breach hereof.\n\n7.3 In no event shall either Party's aggregate liability exceed the fees paid\nin the twelve (12) months immediately preceding the event giving rise to\nliability, which shall be the Parties' exclusive remedy.\n\n7.4 Vendor shall maintain availability of 99.9% and shall credit Customer ten\npercent (10%) of the monthly fees for each month in which availability is\nbelow 99.5%.\n\n7.5 Any notice shall be deemed given five (5) days after deposit in the mail.\n\nCONFIDENTIAL - Page 4\n\n8.1 Governing Law. This Agreement shall be governed by and construed in\naccordance with the laws of England and Wales, without giving effect to\nconflict of laws principles.\n\nSCHEDULE A. PRICING. For Annual Volume of up to 260 transponder-month, the\nUnit Price shall be $40,375 per transponder-month; for Annual Volume in excess\nof 260 transponder-month and up to 780 transponder-month, the Unit Price shall\nbe $37,401 per transponder-month; and for Annual Volume in excess of 780\ntransponder-month, the Unit Price shall be $35,241 per transponder-month. The\nforegoing tiered Unit Prices shall be applied on a marginal basis, such that\neach unit of Annual Volume shall be priced at the rate applicable to the tier\nin which such unit falls.\n\nIN WITNESS WHEREOF, the Parties have caused this Agreement to be executed by\ntheir duly authorized representatives.\n","accepted":true,"flagged":[],"fields":[{"name":"customer_party","critical":false,"value":"Halyard Digital Ventures LLC","status":"accept","reasons":[],"conf":0.92,"spans":[[179,288]],"corrected":false},{"name":"vendor_party","critical":false,"value":"Marlow Satcom, Inc.","status":"accept","reasons":[],"conf":0.92,"spans":[[179,288]],"corrected":false},{"name":"service_category","critical":true,"value":"satellite_distribution","statu ontrol, without the prior written consent of the other Party, such consent\nnot to be unreasonably withheld.\n\nCONFIDENTIAL - Page 3\n\n6.2 Requirements. Nothing herein shall obligate Customer to purchase the\nServices exclusively from Vendor.\n\n6.3 Pricing Warranty. Vendor makes no representation or warranty regarding the\nprices charged to other customers.\n\n7.1 The obligations of confidentiality set forth herein shall survive for a\nperiod of three (3) years following termination or expiration of this\nAgreement.\n\n7.2 Vendor shall defend, indemnify and hold harmless Customer, its Affiliates\nand their respective directors, officers and employees from and against any\nthird-party claims arising out of Vendor's breach hereof.\n\n7.3 In no event shall either Party's aggregate liability exceed the fees paid\nin the twelve (12) months immediately preceding the event giving rise to\nliability, which shall be the Parties' exclusive remedy.\n\n7.4 Vendor shall maintain availability of 99.9% and shall credit Customer ten\npercent (10%) of the monthly fees for each month in which availability is\nbelow 99.5%.\n\nCONFIDENTIAL - Page 4\n\n7.5 Any notice shall be deemed given five (5) days after deposit in the mail.\n\n8.1 Governing Law. This Agreement shall be governed by and construed in\naccordance with the laws of the State of California, without giving effect to\nconflict of laws principles.\n\nSCHEDULE A. PRICING. For Annual Volume of up to 100,000 title, the Unit Price\nshall be $15.18 per title; for Annual Volume in excess of 100,000 title and up\nto 310,000 title, the Unit Price shall be $14.35 per title; and for Annual\nVolume in excess of 310,000 title, the Unit Price shall be $13.54 per title.\nThe foregoing tiered Unit Prices shall be applied on a marginal basis, such\nthat each unit of Annual Volume shall be priced at the rate applicable to the\ntier in which such unit falls.\n\nIN WITNESS WHEREOF, the Parties have caused this Agreement to be executed by\nt edit Customer ten\npercent (10%) of the monthly fees for each month in which availability is\nbelow 99.5%.\n\n7.5 Any notice shall be deemed given five (5) days after deposit in the mail.\n\n8.1 Governing Law. This Agreement shall be governed by and construed in\naccordance with the laws of the State of Delaware, without giving effect to\nconflict of laws principles.\n\nCONFIDENTIAL - Page 4\n\nSCHEDULE A. PRICING. For Annual Volume of up to 210,000 GB-month, the Unit\nPrice shall be $12.96 per GB-month; for Annual Volume in excess of 210,000 GB-\nmonth and up to 620,000 GB-month, the Unit Price shall be $12.42 per GB-month;\nand for Annual Volume in excess of 620,000 GB-month, the Unit Price shall be\n$11.56 per GB-month. The foregoing tiered Unit Prices shall be applied on a\nmarginal basis, such that each unit of Annual Volume shall be priced at the\nrate applicable to the tier in which such unit falls.\n\nIN WITNESS WHEREOF, the Parties have caused this Agreement to be executed by\ntheir duly authorized representatives.\n\nFIRST AMENDMENT TO MASTER SERVICES AGREEMENT\n\nThis First Amendment is made as of the 18th day of July, 2025. The Initial\nTerm set forth in Section 3.1 is hereby extended by a period of one (1) year.\nIn all other respects the Agreement is ratified and confirmed.\n\nSECOND AMENDMENT TO MASTER SERVICES AGREEMENT\n\nThis Second Amendment is made as of the 31st day of December, 2025. Schedule A\nis hereby deleted in its entirety and replaced with the following: For Annual\nVolume of up to 210,000 GB-month, the Unit Price shall be $11.39 per GB-month;\nfor Annual Volume in excess of 210,000 GB-month and up to 620,000 GB-month,\nthe Unit Price shall be $10.91 per GB-month; and for Annual Volume in excess\nof 620,000 GB-month, the Unit Price shall be $10.15 per GB-month. The\nforegoing tiered Unit Prices shall be applied on a marginal basis, such that\neach unit of Annual Volume shall be priced at the rate applicable to the tier\nin which such unit falls. In all other respects the Agreement is ratified and\nconfirmed.\n\nCONFIDENTIAL - Page 5\n","accepted":true,"flagged":[],"fields":[{"name":"customer_party","critical":false,"value":"Halyard Networks Corporation","status":"accept","reasons":[],"conf":0.92,"spans":[[179,286]],"corrected":false},{"name":"vendor_party","critical":false,"value":"Juniper Legal LLC","status":"accept","reasons":[],"conf":0.92,"spans":[[179,286]],"corrected":false},{"name":"service_category","critical":true,"value":"ediscovery_hosting","status":"accept","reasons":[],"conf":0.92,"spans":[[315,389]],"corrected":false},{"name":"effective_date","critical":true,"value":"2024-01-11","status":"accept","reasons":[],"conf":0.92,"spans":[[102,147]],"corrected":false},{"name":"initial_term_months","critical":true,"value":"48 months","status":"accept","reasons":[],"conf":0.92,"spans":[[509,702],[3679,3768]],"corrected":false},{"name":"auto_renew","critical":true,"value":"yes","status":"accept","reasons":[],"conf":0.92,"spans":[[717,1031]],"corrected":false},{"name":"renewal_term_months","critical":false,"value":"24 months","status":"accept","reasons":[],"conf":0.92,"spans":[[717,1031]],"corrected":false},{"name":"nonrenewal_notice","critical":true,"value":"120 days","status":"accept","reasons":[],"conf":0.92,"spans":[[717,1031]],"corrected":false},{"name":"termination_for_convenience","critical":true,"value":"no","status":"accept","reasons":[],"conf":0.8,"spans":[],"corrected":false},{"name":"tfc_notice_days","critical":false,"value":"\u2014","status":"accept","reasons":[],"conf":0.8,"spans":[],"corrected":false},{"name":"early_termination_fee_pct","critical":true,"value":"\u2014","status":"accept","reasons":[],"conf":0.8,"spans":[],"corrected":false},{"name":"min_annual_commit_usd","critical":true,"value":"\u2014","status":"accept","reasons":[],"conf":0.92,"spans":[[1127,1142]],"corrected":false},{"name":"pricing","critical":true,"value":"graduated per GB-month \u00b7 0\u2013210,000: $11.39 | <script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M = x=>{const a=Math.abs(x);return (x<0?'-':'')+'$'+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(a>=1e7?1:2)+'M':a>=1e3?Math.round(a/1e3)+'K':Math.round(a))};
const N = x=>x.toLocaleString('en-US');
const state={tab:'overview',scn:'before',doc:null,field:null,docFilter:'flagged',calKind:'all',calQ:''};
const TABS=[['overview','Overview'],['calendar','Decision calendar'],['plan','Sequenced plan'],['review','Review queue & evidence'],['risks','Risks'],['eval','Evaluation']];
const REASON={UNGROUNDED:'quoted evidence is not in the document',CONTRADICTED:'the quote contradicts the value',UNCORROBORATED:'independent parser could not confirm the value from the quote',
 NO_EVIDENCE:'no supporting quote',CUE_MISSED:'says "absent" but the document contains related language',UNSUPPORTED_POSITIVE:'positive claim with no matching vocabulary in the document',
 SUPERSEDED_RISK:'cited from the base agreement; a later amendment discusses it',LOW_CONFIDENCE:'extractor confidence below floor',DOC_UNREADABLE:'mandatory facts missing: extractor did not understand this document',NO_VALUE:'required field empty'};
const reasonText=r=>r.startsWith('INVARIANT:')?'internal inconsistency ('+r.slice(10).toLowerCase().replace(/_/g,' ')+')':(REASON[r]||r);
const S = ()=>D[state.scn];

function init(){
  $('#chip-docs').innerHTML=`${D.meta.docs_accepted}/${D.meta.docs} contracts auto-verified · ${D.meta.fields_flagged} of ${D.meta.fields_total} critical fields to review`;
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-k="${k}" aria-selected="${k===state.tab}">${l}</button>`).join('');
  $('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){state.tab=b.dataset.k;render()}};
  for(const k of ['before','after']) $('#sc-'+k).onclick=()=>{state.scn=k;render()};
  $('#theme').onclick=e=>{e.preventDefault();const r=document.documentElement;const dark=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=dark?'light':'dark';render()};
  $('#foot').innerHTML=`As of ${D.meta.asof} (Skydance–Warner Bros. Discovery closing ${D.meta.closing}). Extractor: <code>${esc(D.meta.extractor)}</code>. All contracts are synthetic; dollar figures follow from generator assumptions and are illustrative. Savings come from contract terms (pooled-volume tier pricing net of exit fees, switching cost and notice windows), not from model guesses.`;
  render();
}
function render(){
  for(const k of ['before','after']) $('#sc-'+k).setAttribute('aria-pressed',state.scn===k);
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===state.tab));
  const m=$('#main'); ({overview,calendar,plan,review,risks,evalTab})[state.tab==='eval'?'evalTab':state.tab](m);
  $('#tip').style.display='none';
}

/* ---------- overview ---------- */
function tile(l,v,s){return `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`}
function overview(m){
  const k=S().kpi, o=D.before.kpi, a=D.after.kpi;
  const fr=k.ideal_npv?Math.round(100*(1-k.npv/k.ideal_npv)):0;
  m.innerHTML=`<div class="grid kpis">
   ${tile('Annual spend under management',M(k.spend),`${k.contracts} verified contracts${k.excluded?` · ${k.excluded} awaiting review`:''}`)}
   ${tile('Identified run-rate savings',M(k.run_rate),`${k.run_rate_pct}% of spend · from contract terms`)}
   ${tile('Plan NPV (12 quarters, 8%)',M(k.npv),`net of ${M(k.one_time)} exit fees + switching`)}
   ${tile('Live by end of year 1 / year 2',`${k.y1_share}% / ${k.y2_share}%`,'of final run-rate · stated pattern 30% / 70%')}
   ${tile('Notice deadlines in next 90 days',M(k.next90_at_stake),`${k.next90_n} contracts auto-renew if missed`)}
   ${tile('Cost of contract friction',`${fr}%`,`of ideal NPV ${M(k.ideal_npv)} lost to notice windows, exit fees, lead times, team capacity`)}
  </div>
  <div class="grid two">
   <div class="card"><h2>When the savings can actually start</h2>
    <p class="sub">Annualized run-rate by quarter. Notice windows, exit fees and migration lead times decide <i>when</i> pooled pricing becomes legally and operationally available.</p>
    <div id="chart"></div><div class="legend" id="lg"></div></div>
   <div class="card"><h2>${state.scn==='before'?'What the review queue is holding back':'What clearing the review queue unlocked'}</h2>
    <p class="sub">Only contracts whose critical fields all pass the verification gate reach the planner.</p>
    <table><tr><th></th><th class="n">Queue open</th><th class="n">Queue cleared</th></tr>
     <tr><td>Contracts in plan</td><td class="n">${o.contracts}</td><td class="n">${a.contracts}</td></tr>
     <tr><td>Run-rate savings</td><td class="n">${M(o.run_rate)}</td><td class="n">${M(a.run_rate)}</td></tr>
     <tr><td>Plan NPV</td><td class="n">${M(o.npv)}</td><td class="n">${M(a.npv)}</td></tr>
     <tr><td>Deadlines tracked</td><td class="n">${D.before.calendar.length}</td><td class="n">${D.after.calendar.length}</td></tr></table>
    <p class="note" style="margin-top:10px">A reviewer resolved <b>${D.meta.corrected_fields}</b> field${D.meta.corrected_fields==1?'':'s'} across <b>${D.meta.docs-D.meta.docs_accepted}</b> contract${D.meta.docs-D.meta.docs_accepted==1?'':'s'}. Review is simulated with ground truth (synthetic corpus only). Open the <a href="#" data-go="review">review queue</a> to see the evidence behind each flag.</p>
    <p class="note">Planner: ${k.optimal?'exact MILP (HiGHS)':'greedy fallback'} over ${N(k.options)} candidate actions, ${k.actions} selected.</p></div>
  </div>
  <div class="card"><h2>Next decisions</h2><p class="sub">Earliest contractual deadlines with the dollars that auto-commit if they are missed. Internal date includes a safety buffer.</p>${calTable(S().calendar.filter(e=>e.kind==='notice_deadline').slice(0,8),true)}</div>`;
  m.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();state.tab=a.dataset.go;render()});
  lineChart($('#chart'),S().series);
}
function lineChart(el,s){
  const css=getComputedStyle(document.documentElement);
  const col={plan:css.getPropertyValue('--s1').trim(),ideal:css.getPropertyValue('--s2').trim(),target:css.getPropertyValue('--ink-3').trim(),grid:css.getPropertyValue('--grid').trim(),ink:css.getPropertyValue('--ink-2').trim(),surface:css.getPropertyValue('--surface').trim()};
  const W=Math.max(320,el.clientWidth||640),H=300,L=56,R=98,T=14,B=30,n=s.labels.length;
  const ymax=Math.max(...s.plan,...s.ideal,...s.target,1)*1.08,x=i=>L+(W-L-R)*i/(n-1),y=v=>T+(H-T-B)*(1-v/ymax);
  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const ticks=[0,.25,.5,.75,1].map(f=>f*ymax);
  let g=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${col.grid}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" fill="${col.ink}" font-size="11">${M(v)}</text>`).join('');
  g+=s.labels.map((l,i)=>i%2===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="${col.ink}" font-size="11">${l}</text>`:'').join('');
  g+=`<path d="${path(s.target)}" fill="none" stroke="${col.target}" stroke-width="2" stroke-dasharray="5 4"/>`;
  g+=`<path d="${path(s.ideal)}" fill="none" stroke="${col.ideal}" stroke-width="2"/>`;
  g+=`<path d="${path(s.plan)}" fill="none" stroke="${col.plan}" stroke-width="2.5"/>`;
  const last=n-1,lab=[['plan','Plan'],['ideal','No friction'],['target','30/70/100']];
  const ys=lab.map(([k])=>y(s[k][last])); // nudge labels apart
  const order=[0,1,2].sort((a,b)=>ys[a]-ys[b]);for(let i=1;i<3;i++){const p=order[i-1],c=order[i];if(ys[c]-ys[p]<14)ys[c]=ys[p]+14}
  lab.forEach(([k,t],i)=>{g+=`<circle cx="${x(last)}" cy="${y(s[k][last])}" r="4" fill="${col[k]}" stroke="${col.surface}" stroke-width="2"/><text x="${x(last)+9}" y="${ys[i]+4}" fill="${col.ink}" font-size="11.5">${t}</text>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Run-rate savings by quarter: plan, no-friction ideal, and the 30/70/100 pattern">${g}<line id="cx" y1="${T}" y2="${H-B}" stroke="${col.ink}" stroke-opacity=".35" style="display:none"/><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/></svg>`;
  $('#lg').innerHTML=`<span><b style="border-color:${col.plan}"></b>Plan (what notice windows and capacity allow)</span><span><b style="border-color:${col.ideal}"></b>No-friction ideal (same clusters, no contract constraints)</span><span><b style="border-color:${col.target};border-top-style:dashed"></b>Stated 30% / 70% / 100% phasing applied to the plan's final run-rate</span>`;
  const tip=$('#tip'),hit=$('#hit'),cx=$('#cx');
  hit.onmousemove=e=>{const r=hit.getBoundingClientRect();const f=(e.clientX-r.left)/r.width;const i=Math.max(0,Math.min(n-1,Math.round(f*(n-1))));
    cx.setAttribute('x1',x(i));cx.setAttribute('x2',x(i));cx.style.display='';
    tip.style.display='block';tip.style.left=Math.min(innerWidth-230,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';
    tip.innerHTML=`<b>${s.labels[i]}</b><div><span>Plan</span><span>${M(s.plan[i])}</span></div><div><span>No friction</span><span>${M(s.ideal[i])}</span></div><div><span>30/70/100 pattern</span><span>${M(s.target[i])}</span></div>`};
  hit.onmouseleave=()=>{tip.style.display='none';cx.style.display='none'};
}

/* ---------- calendar ---------- */
const KIND={notice_deadline:['▲','Notice due','sev-high'],locked_in:['■','Locked in','sev-medium'],term_end:['●','Term ends','sev-low']};
function calTable(rows,compact){
  return `<div class="scroll"><table><tr><th>Due</th><th class="n">Days</th><th>Contract</th><th>Vendor · category</th><th class="n">At stake</th><th>Status</th>${compact?'':'<th>Internal date</th><th>What happens</th>'}</tr>`+
  rows.map(e=>{const [ic,lb,cl]=KIND[e.kind];return `<tr><td>${e.due}</td><td class="n">${e.days}</td><td><b>${e.cid}</b> <span class="note">(${e.entity})</span>${e.provisional?' <span class="chip">provisional</span>':''}</td><td>${esc(e.vendor)} <span class="note">· ${esc(e.category)}</span></td><td class="n">${e.at_stake?M(e.at_stake):'—'}</td><td><span class="st ${cl}"><i>${ic}</i>${lb}</span></td>${compact?'':`<td>${e.internal_due||'—'}</td><td class="note">${esc(e.note)}</td>`}</tr>`}).join('')+`</table></div>`;
}
function calendar(m){
  m.innerHTML=`<div class="card"><h2>Decision calendar</h2><p class="sub">Every date a contract forces a decision, with the dollars attached. A missed non-renewal notice silently re-commits the company to another renewal term. Dates use calendar-month arithmetic and roll back to the prior business day.</p>
   <div class="filters"><select id="ck"><option value="all">All events</option><option value="notice_deadline">Notice due</option><option value="locked_in">Locked in</option><option value="term_end">Term ends</option></select>
   <input type="search" id="cq" placeholder="Filter by contract, vendor, category…" style="min-width:260px"><span class="note" id="cn"></span></div><div id="ct"></div></div>`;
  const upd=()=>{const q=state.calQ.toLowerCase();const rows=S().calendar.filter(e=>(state.calKind==='all'||e.kind===state.calKind)&&(!q||(e.cid+e.vendor+e.category).toLowerCase().includes(q)));$('#ct').innerHTML=calTable(rows,false);$('#cn').textContent=rows.length+' events · '+M(rows.reduce((a,e)=>a+e.at_stake,0))+' at stake'};
  $('#ck').value=state.calKind;$('#cq').value=state.calQ;
  $('#ck').onchange=e=>{state.calKind=e.target.value;upd()};$('#cq').oninput=e=>{state.calQ=e.target.value;upd()};upd();
}

/* ---------- plan ---------- */
function plan(m){
  const P=S().plan,k=S().kpi;
  m.innerHTML=`<div class="card"><h2>Sequenced consolidation plan</h2><p class="sub">${k.actions} actions chosen by an exact optimizer to maximize NPV subject to contract notice windows, exit fees, affiliate-purchasing and change-of-control lead times, and a quarterly migration capacity (streaming-stack work shares a smaller pool with platform convergence). Run-rate ${M(k.run_rate)}, one-time costs ${M(k.one_time)}.</p>
   <div class="scroll"><table><tr><th>When</th><th>Category</th><th>Consolidate onto</th><th class="n">Contracts</th><th class="n">Baseline</th><th class="n">Pooled</th><th class="n">Annual saving</th><th class="n">One-time</th><th class="n">NPV</th></tr>`+
   P.map((o,i)=>`<tr class="click" data-i="${i}"><td>${o.when}</td><td>${esc(o.category)}${o.provisional?' <span class="chip">provisional</span>':''}</td><td><b>${o.survivor}</b> · ${esc(o.survivor_vendor)}</td><td class="n">${o.members.length}</td><td class="n">${M(o.baseline)}</td><td class="n">${M(o.pooled)}</td><td class="n"><b>${M(o.saving)}</b></td><td class="n">${M(o.one_time)}</td><td class="n">${M(o.npv)}</td></tr><tr id="d${i}" style="display:none"><td></td><td colspan="8"><div class="note"><b>Contracts pooled:</b> ${o.members.map(c=>`${c.cid} (${esc(c.vendor)}, ${c.entity})`).join(' · ')}<ul>${o.steps.map(s=>`<li>${esc(s)}</li>`).join('')||'<li>No contractual prerequisites</li>'}</ul></div></td></tr>`).join('')+`</table></div><p class="note">Click a row for the pooled contracts and the legal/commercial steps that gate it.</p></div>`;
  m.querySelectorAll('tr.click').forEach(r=>r.onclick=()=>{const d=$('#d'+r.dataset.i);d.style.display=d.style.display==='none'?'':'none'});
}

/* ---------- review queue ---------- */
function review(m){
  const docs=D.docs.filter(d=>state.docFilter==='all'||!d.accepted).sort((a,b)=>state.docFilter==='all'?0:(a.flagged.length-b.flagged.length)||a.id.localeCompare(b.id));
  if(!state.doc||!D.docs.find(d=>d.id===state.doc)) state.doc=(docs[0]||D.docs[0]).id;
  m.innerHTML=`<div class="filters"><div class="seg"><button id="f-fl" aria-pressed="${state.docFilter==='flagged'}">Needs review (${D.docs.filter(d=>!d.accepted).length})</button><button id="f-all" aria-pressed="${state.docFilter==='all'}">All contracts (${D.docs.length})</button></div>
   <span class="note">Nothing the extractor says is trusted until the quote is found in the document, supports the value, and the cross-field checks pass.</span></div>
   <div class="split"><div class="list" id="dl">${docs.map(d=>`<div class="it" data-id="${d.id}" aria-current="${d.id===state.doc}"><b>${d.id}</b> <span class="note">· style ${d.style}${d.style===3?' (held-out)':''}</span><br><span class="note">${esc(d.vendor||'vendor not extracted')} · ${esc(d.category)}</span><br>${d.accepted?'<span class="st good"><i>✓</i>auto-verified</span>':`<span class="st sev-medium"><i>▲</i>${d.flagged.length} field${d.flagged.length==1?'':'s'} to review</span>`}</div>`).join('')}</div><div class="view" id="dv"></div></div>`;
  $('#f-fl').onclick=()=>{state.docFilter='flagged';render()};$('#f-all').onclick=()=>{state.docFilter='all';render()};
  $('#dl').onclick=e=>{const it=e.target.closest('.it');if(it){state.doc=it.dataset.id;state.field=null;render()}};
  docView();
}
function docView(){
  const d=D.docs.find(x=>x.id===state.doc);const el=$('#dv');if(!d){el.textContent='No contracts.';return}
  const marks=[];for(const f of d.fields)for(const [s,e] of f.spans)marks.push({s,e,f:f.name,st:f.status});
  marks.sort((a,b)=>a.s-b.s);let pos=0,html='';
  for(const mk of marks){if(mk.s<pos)continue;html+=esc(d.text.slice(pos,mk.s))+`<mark class="${mk.st==='accept'?'ok':'rev'}" data-f="${mk.f}">${esc(d.text.slice(mk.s,mk.e))}</mark>`;pos=mk.e}
  html+=esc(d.text.slice(pos));
  const rows=d.fields.filter(f=>f.critical||f.status==='review').map(f=>`<div class="frow${state.field===f.name?' sel':''}" data-f="${f.name}"><div class="nm">${f.name.replace(/_/g,' ')}</div><div class="val">${esc(f.value)}${f.reasons.length?`<div class="reasons">${f.reasons.map(r=>esc(reasonText(r))).join(' · ')}</div>`:''}${f.corrected&&state.scn==='after'?'<div class="reasons" style="color:var(--good)">✓ corrected by reviewer</div>':''}</div><div>${f.status==='accept'?'<span class="st good"><i>✓</i>verified</span>':'<span class="st sev-medium"><i>▲</i>review</span>'}</div></div>`).join('');
  el.innerHTML=`<b>${d.id}</b> · entity ${d.entity} · drafting style ${d.style}${d.style===3?' (held-out)':''} · ${d.accepted?'<span class="st good"><i>✓</i>all critical fields verified</span>':`<span class="st sev-medium"><i>▲</i>${d.flagged.length} critical field(s) need a human</span>`}
   <div style="margin-top:8px">${rows}</div><p class="note" style="margin:10px 0 0">Highlighted text is the evidence the extractor cited, located in the source by the verifier (green = verified, amber = flagged). Click a field to jump to its evidence.</p><pre class="doc" id="pre">${html}</pre>`;
  el.querySelectorAll('.frow').forEach(r=>r.onclick=()=>{state.field=r.dataset.f;el.querySelectorAll('.frow').forEach(x=>x.classList.toggle('sel',x===r));el.querySelectorAll('mark').forEach(x=>x.classList.toggle('sel',x.dataset.f===state.field));const t=el.querySelector('mark.sel');if(t)t.scrollIntoView({block:'center',behavior:'smooth'})});
}

/* ---------- risks ---------- */
function risks(m){
  const R=S().risks,tot=R.filter(r=>r.severity==='high').length;
  const IC={high:['▲','High'],medium:['■','Medium'],low:['●','Low']};
  m.innerHTML=`<div class="card"><h2>Merger-specific contract risks</h2><p class="sub">Change-of-control clauses are evaluated only for the acquired company's paper (the closing is a change of control for it, not for the acquirer). ${tot} high-severity.</p>
   <div class="scroll"><table><tr><th>Severity</th><th>Contract</th><th>Vendor</th><th>Flag</th><th class="n">Exposure</th><th>Why it matters</th></tr>${R.map(r=>`<tr><td><span class="st sev-${r.severity}"><i>${IC[r.severity][0]}</i>${IC[r.severity][1]}</span></td><td><b>${r.cid}</b></td><td>${esc(r.vendor)}</td><td><code>${r.code}</code></td><td class="n">${M(r.exposure)}</td><td class="note">${esc(r.message)}</td></tr>`).join('')}</table></div></div>`;
}

/* ---------- evaluation ---------- */
function evalTab(m){
  const R=D.results;
  if(!R){m.innerHTML='<div class="card"><h2>Evaluation</h2><p class="sub">Run <code>python -m clause_to_cash.evals.run</code> and rebuild the dashboard to embed results.</p></div>';return}
  const f=R.faults,full=f.catch_pct.full.ALL,conf=f.catch_pct.confidence_only.ALL;
  const fresh=R.extraction_gate_fresh,pct=v=>v+'%';
  const e=R.e2e_seen_styles.rates,rk=Object.keys(e),hi=e[rk[rk.length>2?2:rk.length-1]];
  m.innerHTML=`<div class="grid cols3">
   ${tile('Injected extraction faults caught',pct(full),`${N(f.trials)} corruptions · confidence-only gate catches ${pct(conf)}`)}
   ${tile('Wrong fields auto-accepted',['0','1','2','3'].reduce((a,s)=>a+fresh[s].fields_accepted_wrong,0),'fresh corpora, all four drafting styles, rules baseline + gate')}
   ${tile('Held-out style: auto-accepted',pct(fresh['3'].field_auto_accept_pct),'safe failure: unfamiliar drafting goes to a human, not to the plan')}
  </div>
  <div class="card"><h2>What a wrong extraction does to the plan</h2><p class="sub">An imperfect extractor is simulated by corrupting critical fields at the stated rate (high confidence, realistic failure modes). 'Realized' re-prices each chosen action under ground-truth terms.</p>
   <div class="scroll"><table><tr><th class="n">Field error rate</th><th>Arm</th><th class="n">Plan NPV claimed</th><th class="n">NPV realized</th><th class="n">Invalid actions</th><th class="n">Wrong fields in plan</th><th class="n">Fields sent to review</th></tr>${rk.flatMap(r=>Object.entries(e[r]).map(([a,v])=>`<tr><td class="n">${(+r*100).toFixed(0)}%</td><td>${a.replace(/_/g,' ')}</td><td class="n">${v.claimed_pct_of_gold_npv}%</td><td class="n">${v.realized_pct_of_gold_npv}%</td><td class="n">${v.invalid_actions}/${v.actions}</td><td class="n">${v.wrong_critical_fields_in_plan}/${v.critical_fields_in_plan}</td><td class="n">${v.fields_flagged_pct}%</td></tr>`)).join('')}</table></div>
   <p class="note">Percentages are of the ground-truth plan NPV on the same corpora (fresh seeds ${R.protocol.fresh_seeds.join(', ')}). Magnitudes depend on the fault mix and the synthetic price assumptions; the ranking of the arms is the finding. See docs/EVALUATION.md.</p></div>
  <div class="card"><h2>Which layer catches what</h2><p class="sub">Percent of injected faults routed to review by each layer alone (the full gate combines all of them).</p>
   <div class="scroll"><table><tr><th>Fault</th><th class="n">Full gate</th><th class="n">Confidence only</th><th class="n">Grounding</th><th class="n">Corroboration</th><th class="n">Invariants</th><th class="n">Cue guard</th><th class="n">Supersession</th></tr>${Object.keys(R.faults.per_fault).map(k=>{const c=f.catch_pct;return `<tr><td>${k.replace(/_/g,' ').toLowerCase()} <span class="note">(n=${f.per_fault[k]})</span></td>`+['full','confidence_only','only_grounding','only_corroboration','only_invariants','only_cues','only_supersession'].map(x=>`<td class="n">${c[x][k]??'—'}</td>`).join('')+'</tr>'}).join('')}</table></div></div>`;
}
init();
</script>
</body>
</html>
